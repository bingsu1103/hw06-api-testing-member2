name: Member 2 API tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [regression, baseline, demonstrate-failure, full, full-remediated]
        default: regression
permissions:
  contents: read
jobs:
  member2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run against fresh EShop
        env:
          MODE: ${{ inputs.mode || (github.ref_name == 'ci/failure-demo' && 'demonstrate-failure') || 'regression' }}
        run: |
          case "$MODE" in
            regression) ./scripts/run-newman.sh regression ;;
            baseline) ./scripts/run-newman.sh baseline ;;
            demonstrate-failure) ./scripts/run-newman.sh demonstrate-failure ;;
            full) ./scripts/run-newman.sh ;;
            full-remediated) ./scripts/run-newman.sh full-remediated ;;
          esac
      - name: Upload redacted full report
        if: ${{ always() && (inputs.mode == 'full' || inputs.mode == 'full-remediated') }}
        uses: actions/upload-artifact@v4
        with:
          name: member2-newman-${{ inputs.mode }}
          path: ${{ inputs.mode == 'full-remediated' && 'reports/newman/remediated/report.html' || 'reports/newman/report.html' }}
